<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVACORE</title>
    <script>
      function mostrarErro(msg) {
        document.body.insertAdjacentHTML("afterbegin",
          '<pre style="color:#b3261e;padding:16px;white-space:pre-wrap;font-size:14px">Erro: ' + msg + "</pre>");
      }
      window.addEventListener("error", function (e) { mostrarErro(e.message); });
      window.addEventListener("unhandledrejection", function (e) { mostrarErro(String(e.reason)); });
    </script>
  </head>
  <body>
    <div id="root"><p style="padding:16px;font-family:sans-serif">Carregando NOVACORE...</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
